name: Nightly Scrape

on:
  schedule:
    - cron: '0 8 * * *'  # 2am CT = 8am UTC
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: env.ENABLE_APARTMENTS_COM == 'true'
        run: pnpm --filter @campusnest/scraper exec playwright install chromium --with-deps

      - name: Run scraper
        id: scrape
        run: |
          OUTPUT=$(pnpm --filter @campusnest/scraper start 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT"
          METRICS=$(echo "$OUTPUT" | grep "^::metrics::" | sed 's/^::metrics:://')
          if [ -n "$METRICS" ]; then
            echo "metrics=$METRICS" >> $GITHUB_OUTPUT
          fi
          exit ${EXIT_CODE:-0}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ENABLE_APARTMENTS_COM: 'false'

      - name: Write job summary
        if: always()
        run: |
          echo "## Nightly Scrape Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.scrape.outcome }}" = "failure" ]; then
            echo "> **FAILED** -- Check logs for details" >> $GITHUB_STEP_SUMMARY
          else
            echo "> **SUCCESS**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          METRICS='${{ steps.scrape.outputs.metrics }}'
          if [ -n "$METRICS" ]; then
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Listings Upserted | $(echo $METRICS | jq -r '.upserted') |" >> $GITHUB_STEP_SUMMARY
            echo "| Stale Marked | $(echo $METRICS | jq -r '.staleMarked') |" >> $GITHUB_STEP_SUMMARY
            echo "| Archived | $(echo $METRICS | jq -r '.archived') |" >> $GITHUB_STEP_SUMMARY
            echo "| Deleted | $(echo $METRICS | jq -r '.deleted') |" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $(echo $METRICS | jq -r '.errors') |" >> $GITHUB_STEP_SUMMARY
          else
            echo "*No metrics available -- scraper may have crashed before reporting.*" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Trigger fairness recalculation
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl -s -X POST \
            "${SUPABASE_URL}/functions/v1/recalculate-fairness" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json"

      - name: Generate embeddings for changed listings
        if: success()
        id: embed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          OUTPUT=$(npx tsx packages/ai/src/cli/embed.ts 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT"
          EMBED_METRICS=$(echo "$OUTPUT" | grep "^::embed-metrics::" | sed 's/^::embed-metrics:://')
          if [ -n "$EMBED_METRICS" ]; then
            echo "metrics=$EMBED_METRICS" >> "$GITHUB_OUTPUT"
          fi
          exit ${EXIT_CODE:-0}

      - name: Write embedding summary
        if: always() && steps.embed.outcome != 'skipped'
        env:
          EMBED_OUTCOME: ${{ steps.embed.outcome }}
          EMBED_METRICS: ${{ steps.embed.outputs.metrics }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Embedding Generation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EMBED_OUTCOME" = "failure" ]; then
            echo "> **FAILED** -- Check logs for details" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> **SUCCESS**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EMBED_METRICS" ]; then
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Embedded | $(echo "$EMBED_METRICS" | jq -r '.embedded') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Skipped | $(echo "$EMBED_METRICS" | jq -r '.skipped') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Errors | $(echo "$EMBED_METRICS" | jq -r '.errors') |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "*No metrics available.*" >> "$GITHUB_STEP_SUMMARY"
          fi
