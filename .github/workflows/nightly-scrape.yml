name: Nightly Scrape

on:
  schedule:
    - cron: '0 8 * * *'  # 2am CT = 8am UTC
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Skip Apify scrape and go straight to embeddings (use when data is already fresh)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @campusnest/types --filter @campusnest/utils build

      - name: Check last Zillow scrape age
        id: check_scrape_age
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MANUAL_SKIP: ${{ github.event.inputs.skip_scrape }}
        run: |
          if [ "$MANUAL_SKIP" = "true" ]; then
            echo "Manual override — skipping Apify scrape"
            echo "skip_scrape=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_SEEN=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/listings?source=eq.zillow&select=last_seen_at&order=last_seen_at.desc&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" | jq -r '.[0].last_seen_at // empty')
          if [ -z "$LAST_SEEN" ]; then
            echo "No Zillow listings found — will run scraper"
            echo "skip_scrape=false" >> "$GITHUB_OUTPUT"
          else
            NOW=$(date -u +%s)
            LAST_SEEN_S=$(date -u -d "$LAST_SEEN" +%s)
            AGE=$(( NOW - LAST_SEEN_S ))
            echo "Last Zillow scrape: $LAST_SEEN (${AGE}s ago)"
            if [ "$AGE" -lt 86400 ]; then
              echo "Data is fresh (< 24h) — skipping Apify scrape, proceeding to embeddings"
              echo "skip_scrape=true" >> "$GITHUB_OUTPUT"
            else
              echo "Data is stale (>= 24h) — will run scraper"
              echo "skip_scrape=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install Playwright browsers
        if: env.ENABLE_APARTMENTS_COM == 'true'
        run: pnpm --filter @campusnest/scraper exec playwright install chromium --with-deps

      - name: Run scraper
        id: scrape
        if: steps.check_scrape_age.outputs.skip_scrape != 'true'
        run: |
          OUTPUT=$(pnpm --filter @campusnest/scraper start -- --limit 500 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT"
          METRICS=$(echo "$OUTPUT" | grep "^::metrics::" | sed 's/^::metrics:://')
          if [ -n "$METRICS" ]; then
            echo "metrics=$METRICS" >> "$GITHUB_OUTPUT"
          fi
          DIAGNOSTIC=$(echo "$OUTPUT" | grep "^::diagnostic::" | sed 's/^::diagnostic:://')
          if [ -n "$DIAGNOSTIC" ]; then
            {
              echo "diagnostic<<DIAG_EOF"
              echo "$DIAGNOSTIC"
              echo "DIAG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          exit ${EXIT_CODE:-0}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          ENABLE_APARTMENTS_COM: 'false'

      - name: Write job summary
        if: always()
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          SCRAPE_METRICS: ${{ steps.scrape.outputs.metrics }}
          SCRAPE_DIAGNOSTIC: ${{ steps.scrape.outputs.diagnostic }}
        run: |
          echo "## Nightly Scrape Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SCRAPE_OUTCOME" = "failure" ]; then
            echo "> **FAILED** -- Check logs for details" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SCRAPE_OUTCOME" = "skipped" ]; then
            echo "> **SKIPPED** (Zillow data is fresh, < 24h old — proceeding to embeddings)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> **SUCCESS**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SCRAPE_METRICS" ]; then
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Listings Upserted | $(echo "$SCRAPE_METRICS" | jq -r '.upserted') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Stale Marked | $(echo "$SCRAPE_METRICS" | jq -r '.staleMarked') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Archived | $(echo "$SCRAPE_METRICS" | jq -r '.archived') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Deleted | $(echo "$SCRAPE_METRICS" | jq -r '.deleted') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Errors | $(echo "$SCRAPE_METRICS" | jq -r '.errors') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Notifications | $(echo "$SCRAPE_METRICS" | jq -r '.notifications') |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "*No metrics available -- scraper may have crashed before reporting.*" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Per-source diagnostic table from scraper output
          if [ -n "$SCRAPE_DIAGNOSTIC" ]; then
            echo "$SCRAPE_DIAGNOSTIC" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger fairness recalculation
        if: success() && steps.scrape.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl -s -X POST \
            "${SUPABASE_URL}/functions/v1/recalculate-fairness" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json"

      - name: Generate embeddings for changed listings
        if: success()
        id: embed
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          OUTPUT=$(npx tsx packages/ai/src/cli/embed.ts 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT"
          EMBED_METRICS=$(echo "$OUTPUT" | grep "^::embed-metrics::" | sed 's/^::embed-metrics:://')
          if [ -n "$EMBED_METRICS" ]; then
            echo "metrics=$EMBED_METRICS" >> "$GITHUB_OUTPUT"
          fi
          exit ${EXIT_CODE:-0}

      - name: Write embedding summary
        if: always() && steps.embed.outcome != 'skipped'
        env:
          EMBED_OUTCOME: ${{ steps.embed.outcome }}
          EMBED_METRICS: ${{ steps.embed.outputs.metrics }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Embedding Generation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EMBED_OUTCOME" = "failure" ]; then
            echo "> **FAILED** -- Check logs for details" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> **SUCCESS**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EMBED_METRICS" ]; then
            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Embedded | $(echo "$EMBED_METRICS" | jq -r '.embedded') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Skipped | $(echo "$EMBED_METRICS" | jq -r '.skipped') |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Errors | $(echo "$EMBED_METRICS" | jq -r '.errors') |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "*No metrics available.*" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rebuild PageIndex for CribAI context
        if: success() && steps.embed.outcome == 'success'
        id: pageindex
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/rebuild-pageindex" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::PageIndex rebuild failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write PageIndex rebuild summary
        if: always()
        env:
          PAGEINDEX_OUTCOME: ${{ steps.pageindex.outcome }}
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## PageIndex Rebuild" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PAGEINDEX_OUTCOME" = "failure" ]; then
            echo "> **FAILED** -- Check logs for details" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PAGEINDEX_OUTCOME" = "success" ]; then
            echo "> **SUCCESS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> **SKIPPED** (embedding step did not succeed)" >> "$GITHUB_STEP_SUMMARY"
          fi
